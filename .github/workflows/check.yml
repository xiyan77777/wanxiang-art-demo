name: Demo checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node build.js
      - run: git diff --exit-code -- index.html
      - run: node verify.cjs
      - run: python -m py_compile serve_ai.py tools/image-api/generate.py
      - run: node tools/package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: wanxiang-offline-demo
          path: dist/*.zip
